<!doctype html>

<style>

	.sub span { color: #ffcf3f; }
	.chk { position: absolute; right: -40px; top: -40px; width: 560px; height: 800px; transform: rotate(12deg);
		background: repeating-conic-gradient(#fff 0 25%, #111 0 50%) 0 0 / 70px 70px; opacity: 0.12; }
	.cars { position: absolute; right: 70px; top: 190px; display: flex; flex-direction: column; gap: 18px; }
